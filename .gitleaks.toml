title = "Laya default rules with verified public benchmark digest exceptions"

[extend]
useDefault = true

# These four values are SHA-256 digests of the pinned public English and
# multilingual tokenizer files, verified against the downloaded file bytes.
# Keep all default rules; exempt only this rule AND these exact result paths
# AND an entire tokenizer-hash JSON line containing one of these exact values.
[[allowlists]]
description = "Known public tokenizer file digests in frozen Dom benchmark manifests"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^research/benchmarks/dom/results/(http_(cpu|cuda)\.v[12]\.plan|published_cuda\.v[12])\.json$''']
regexTarget = "line"
regexes = ['''^\s*"tokenizer/tokenizer(_config)?\.json":\s*"(6c8aaa9a542084f2457eab775d4eeb51f92a70c0fd9de28d5edb0ddec3c08d30|50044de60daaa73df97d262e15a40d4faf0160e7d742df64b377877a1320dd12|609d8f4c067cd3950f88594c5a802616cea245823836ef5848ee4fc40aab5b6f|6c6b2d8e3c84ce0e671c129cd6b374b235d6f9863042a5836358d00a89bbb5a1)"[,]?\s*$''']
